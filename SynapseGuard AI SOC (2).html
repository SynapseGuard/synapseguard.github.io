document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ── Abro Sans substitution ────────────────────────────────────────────\n   The app declares `Abro Sans` as --font-primary (display/headings) but\n   the repo does not ship the font file. Until the real file is provided,\n   we alias Abro Sans → Urbanist (thin weight 200 for display headings,\n   per the codebase rule \"display headings use a thin display face\").\n   When real files arrive, drop them in fonts/ and uncomment the @font-face.\n*/\n/*\n@font-face {\n  font-family: \"Abro Sans\";\n  font-weight: 200 700;\n  font-style: normal;\n  font-display: swap;\n}\n*/\n\n:root {\n  /* ─────────── Type ─────────── */\n  --font-display: \"Urbanist\", \"Abro Sans\", system-ui, sans-serif; /* headings */\n  --font-body:    \"Urbanist\", system-ui, sans-serif;               /* prose   */\n  --font-mono:    \"Space Mono\", ui-monospace, \"JetBrains Mono\", monospace;\n\n  /* Type scale (px on 16 base) */\n  --fs-display: 56px;\n  --fs-h1:      36px;\n  --fs-h2:      30px;\n  --fs-h3:      24px;\n  --fs-h4:      20px;\n  --fs-h5:      18px;\n  --fs-body:    16px;\n  --fs-sm:      14px;\n  --fs-caption: 12px;\n  --fs-mono-sys: 12px; /* system labels, timestamps */\n\n  --lh-tight: 1.15;\n  --lh-snug:  1.3;\n  --lh-body:  1.5;\n\n  --ls-display: -0.03em;\n  --ls-heading: -0.025em;\n  --ls-mono:    0.02em;\n\n  /* ─────────── Colors — Brand ─────────── */\n  --color-black:  #0A0A0A;\n  --color-white:  #FFFFFF;\n\n  /* Brand accent — used rarely: focus ring, status, single accent mark */\n  --color-brand:        #0966E9;\n  --color-brand-hover:  #0852C7;\n  --color-brand-active: #063FA5;\n  --color-brand-tint:   #EBF3FF;  /* light pill bg   */\n  --color-brand-soft:   #99C9FF;  /* dark-mode accent */\n\n  /* ─────────── Colors — Gray scale (canonical, non-inverting) ─────────── */\n  --gray-50:  #F8F9FA;\n  --gray-100: #F3F4F6;\n  --gray-200: #E5E7EB;\n  --gray-300: #D1D5DB;\n  --gray-400: #9CA3AF;\n  --gray-500: #6B7280;\n  --gray-600: #4B5563;\n  --gray-700: #374151;\n  --gray-800: #1F2937;\n  --gray-900: #111827;\n\n  /* ─────────── Colors — Status ─────────── */\n  --color-success:        #10B981;\n  --color-success-soft:   #6EE7B7;\n  --color-warning:        #F59E0B;\n  --color-warning-soft:   #FCD34D;\n  --color-danger:         #EF4444;\n  --color-danger-soft:    #FCA5A5;\n  --color-critical:       #DC2626;\n  --color-info:           var(--color-brand);\n\n  /* ─────────── Semantic — default = DARK canvas ───────────\n     The public-facing product is dark. fg/bg/line roles here\n     resolve for the marketing/always-dark surfaces. */\n  --bg-canvas:   #0A0A0A;    /* page bg            */\n  --bg-surface:  #111111;    /* raised surface     */\n  --bg-surface-2:#1F1F1F;    /* modal / inline blk */\n  --bg-surface-3:#262626;    /* hover / selected   */\n\n  --fg-primary:   #F8F9FA;   /* near-white         */\n  --fg-secondary: #D1D5DB;   /* muted              */\n  --fg-tertiary:  #9CA3AF;   /* dim                */\n  --fg-disabled:  #6B7280;\n\n  --line-subtle: #1F1F1F;    /* hairline on black  */\n  --line-medium: #2A2A2A;\n  --line-strong: #374151;\n\n  --focus-ring: 0 0 0 3px rgba(9,102,233,0.35);\n\n  /* ─────────── Spacing ─────────── */\n  --space-xs:  4px;\n  --space-sm:  8px;\n  --space-md: 16px;\n  --space-lg: 24px;\n  --space-xl: 32px;\n  --space-2xl:48px;\n  --space-3xl:64px;\n\n  /* ─────────── Radius ─────────── */\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 12px;\n  --radius-xl: 16px;\n  --radius-2xl:22px;  /* mobile nav pill  */\n  --radius-full: 999px;\n\n  /* ─────────── Shadows ─────────── */\n  --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.35);\n  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);\n  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.5);\n  --shadow-xl: 0 20px 40px -10px rgba(0,0,0,0.6);\n}\n\n/* Light-mode override (explicit, opt-in) */\n:root[data-theme=\"light\"] {\n  --bg-canvas:    #FFFFFF;\n  --bg-surface:   #FFFFFF;\n  --bg ,\n        ph: Math.random() * Math.PI * 2,\n      });\n    }\n    const maxd = 265;\n    let painted = false;\n    const render = (t) => {\n      ctx.clearRect(0, 0, W, H);\n      for (let i = 0; i < N; i++) {\n        for (let j = i + 1; j < N; j++) {\n          const a = nodes[i], b = nodes[j];\n          const dx = a.x - b.x, dy = a.y - b.y;\n          const d = Math.hypot(dx, dy);\n          if (d < maxd) {\n            const o = (1 - d / maxd) * 0.6;\n            ctx.strokeStyle = 'rgba(55,65,81,' + o + ')';\n            ctx.lineWidth = 1;\n            ctx.beginPath();\n            ctx.moveTo(a.x, a.y);\n            ctx.lineTo(b.x, b.y);\n            ctx.stroke();\n          }\n        }\n      }\n      for (const n of nodes) {\n        n.x += n.vx; n.y += n.vy;\n        if (n.x < 0 || n.x > W) n.vx *= -1;\n        if (n.y < 0 || n.y > H) n.vy *= -1;\n        if (n.accent) {\n          const pulse = 0.6 + 0.4 * Math.sin(t / 900 + n.ph);\n          ctx.beginPath();\n          ctx.arc(n.x, n.y, n.r + 7, 0, 7);\n          ctx.fillStyle = 'rgba(9,102,233,' + (0.16 * pulse) + ')';\n          ctx.fill();\n          ctx.beginPath();\n          ctx.arc(n.x, n.y, n.r + 1, 0, 7);\n          ctx.fillStyle = 'rgba(120,180,255,' + (0.55 + 0.45 * pulse) + ')';\n          ctx.fill();\n        } else {\n          ctx.beginPath();\n          ctx.arc(n.x, n.y, n.r, 0, 7);\n          ctx.fillStyle = 'rgba(112,124,142,0.85)';\n          ctx.fill();\n        }\n      }\n      painted = true;\n    };\n    const loop = (t) => {\n      if (this._stopped) return;\n      if (!painted || !section || section.hasAttribute('data-deck-active')) {\n        render(t || 0);\n      }\n      this._rafIds.push(requestAnimationFrame(loop));\n    };\n    render(0);\n    this._rafIds.push(requestAnimationFrame(loop));\n  }\n\n  _wireCounters() {\n    let tries = 0;\n    const find = () => {\n      const stage = document.querySelector('deck-stage');\n      if (stage && typeof stage.addEventListener === 'function') {\n        this._stage = stage;\n        this._onChange = (e) => {\n          const slide = e.detail && e.detail.slide;\n          if (!slide) return;\n          slide.querySelectorAll('[data-count]').forEach((el) => this._count(el));\n        };\n        stage.addEventListener('slidechange', this._onChange);\n        return;\n      }\n      if (tries++ < 40) setTimeout(find, 80);\n    };\n    find();\n  }\n\n  _count(el) {\n    const target = parseFloat(el.getAttribute('data-count'));\n    if (isNaN(target)) return;\n    const pre = el.getAttribute('data-pre') || '';\n    const suf = el.getAttribute('data-suf') || '';\n    const dec = parseInt(el.getAttribute('data-dec') || '0', 10);\n    const dur = 1100;\n    const start = performance.now();\n    const step = (now) => {\n      if (this._stopped) return;\n      const p = Math.min(1, (now - start) / dur);\n      const eased = 1 - Math.pow(1 - p, 3);\n      const v = target * eased;\n      el.textContent = pre + v.toFixed(dec) + suf;\n      if (p < 1) requestAnimationFrame(step);\n      else el.textContent = pre + target.toFixed(dec) + suf;\n    };\n    requestAnimationFrame(step);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
